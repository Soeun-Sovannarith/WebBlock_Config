# Shared baseline configuration across all WebBlock services.
# When using Spring Cloud Config Server, this file is loaded by all Spring services as the common base.
spring:
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:webblock}
    password: ${RABBITMQ_PASSWORD:webblock}
    listener:
      simple:
        default-requeue-rejected: false # after retries, send the message to the dead-letter queue
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri must match the "iss" claim in the token (the public Keycloak URL).
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/webblock}
          # jwk-set-uri is where the service downloads signing keys (can be the in-cluster Keycloak URL).
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/webblock/protocol/openid-connect/certs}

server:
  shutdown: graceful
  forward-headers-strategy: framework # trust X-Forwarded-* headers set by ingress

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true # /actuator/health/liveness and /actuator/health/readiness for Kubernetes
